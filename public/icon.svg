<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#db2777" />
    </linearGradient>
    <linearGradient id="file1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" />

  <!-- Dual File 1 (Back File - Indigo) -->
  <g transform="translate(100, 90) rotate(-7)" filter="url(#shadow)">
    <rect x="0" y="0" width="180" height="240" rx="20" fill="#312e81" stroke="#818cf8" stroke-width="6" />
    <line x1="30" y1="50" x2="150" y2="50" stroke="#a5b4fc" stroke-width="8" stroke-linecap="round" />
    <line x1="30" y1="80" x2="150" y2="80" stroke="#a5b4fc" stroke-width="8" stroke-linecap="round" />
    <line x1="30" y1="110" x2="110" y2="110" stroke="#a5b4fc" stroke-width="8" stroke-linecap="round" />
  </g>

  <!-- Dual File 2 (Front File - White) -->
  <g transform="translate(190, 110) rotate(5)" filter="url(#shadow)">
    <rect x="0" y="0" width="190" height="250" rx="20" fill="url(#file1Grad)" stroke="#c7d2fe" stroke-width="4" />
    <line x1="32" y1="55" x2="158" y2="55" stroke="#6366f1" stroke-width="8" stroke-linecap="round" />
    <line x1="32" y1="88" x2="158" y2="88" stroke="#818cf8" stroke-width="8" stroke-linecap="round" />
    <line x1="32" y1="120" x2="120" y2="120" stroke="#a5b4fc" stroke-width="8" stroke-linecap="round" />
  </g>

  <!-- Center Inspection Badge / Checkmark Shield -->
  <g transform="translate(256, 350)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="75" fill="#10b981" stroke="#ffffff" stroke-width="8" />
    <!-- Checkmark & Sparkle -->
    <path d="M-28 -4 L-8 18 L32 -22" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- AI Sparkle Top Right -->
  <g transform="translate(390, 85)">
    <path d="M0 -30 Q0 0 30 0 Q0 0 0 30 Q0 0 -30 0 Q0 0 0 -30 Z" fill="#fbbf24" />
  </g>
</svg>
